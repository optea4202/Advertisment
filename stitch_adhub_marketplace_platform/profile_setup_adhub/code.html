<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #bcc9c6;
            border-radius: 20px;
        }
      </style>

<body class="bg-background min-h-screen flex items-center justify-center p-md md:p-xl relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute top-0 left-0 w-full h-[409px] bg-gradient-to-b from-surface-container-low to-background -z-10"></div>
<div class="absolute -top-[20%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[100px] -z-10 pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-[600px] bg-surface-container-lowest rounded-[24px] shadow-[0_1px_3px_rgba(0,0,0,0.05),0_10px_15px_-5px_rgba(0,0,0,0.02)] p-lg md:p-xl flex flex-col relative z-10 border border-outline-variant/30">
<!-- Header Section -->
<header class="flex flex-col items-center mb-xl">
<!-- Brand -->
<div class="mb-lg">
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">AdHub</span>
</div>
<!-- Progress Indicator -->
<div class="w-full max-w-[300px] mb-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Profile Setup</span>
<span class="font-label-sm text-label-sm text-primary font-bold">Step 1 of 2</span>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
<div class="w-1/2 h-full bg-primary rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Titles -->
<div class="text-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Personal Details</h1>
<p class="font-body-md text-body-md text-secondary">Let's build your identity on the marketplace.</p>
</div>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-lg">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center gap-sm mb-md">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden transition-all duration-200 group-hover:border-primary group-hover:bg-surface-container-low">
<span class="material-symbols-outlined text-secondary group-hover:text-primary text-[32px] transition-colors">add_a_photo</span>
</div>
<!-- Hover overlay -->
<div class="absolute inset-0 rounded-full bg-primary/0 group-hover:bg-primary/5 transition-colors duration-200 pointer-events-none"></div>
</div>
<span class="font-label-sm text-label-sm text-secondary group-hover:text-primary transition-colors">Upload Photo</span>
</div>
<!-- Inputs Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Username -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface" for="username">Username</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 transition-all duration-200" id="username" placeholder="e.g. ad_maverick" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 transition-all duration-200" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Short Bio -->
<div class="flex flex-col gap-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface flex justify-between" for="bio">
<span>Short Bio</span>
<span class="text-secondary font-normal font-body-sm text-body-sm">Optional</span>
</label>
<textarea class="w-full h-24 resize-none bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-secondary-fixed-dim focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/10 transition-all duration-200" id="bio" placeholder="Tell us a brief story about your advertising focus..."></textarea>
</div>
</div>
<!-- Action Button -->
<div class="mt-md pt-lg border-t border-surface-container flex justify-end">
<button class="w-full md:w-auto bg-primary text-on-primary border-t border-white/20 rounded-lg px-xl py-sm font-label-md text-label-md shadow-sm hover:bg-primary-container hover:text-on-primary-container transition-all duration-200 flex items-center justify-center gap-sm" type="button">
<span>Continue to Step 2</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</main>
</body></html>
