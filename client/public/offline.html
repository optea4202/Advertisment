<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zobazar - Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1114;
        color: #e2e8f0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(0, 104, 95, 0.15);
        border: 2px solid rgba(0, 104, 95, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(0, 104, 95, 0.4); }
        50% { box-shadow: 0 0 0 16px rgba(0, 104, 95, 0); }
      }

      .icon-wrap svg {
        width: 48px;
        height: 48px;
        color: #00857a;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        font-size: 1.875rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }

      p {
        font-size: 1rem;
        color: #94a3b8;
        max-width: 360px;
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #00685f;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s, transform 0.1s;
      }

      .btn:hover { background: #00857a; }
      .btn:active { transform: scale(0.97); }

      .brand {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.25rem;
        font-weight: 700;
        color: #00857a;
        letter-spacing: -0.02em;
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 6px;
        animation: blink 1.5s step-start infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .status-label {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <span class="brand">zobazar</span>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/>
        <path d="M3.6 9h16.8M3.6 15h16.8"/>
        <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>No internet connection detected. Some previously visited pages may still be available from cache.</p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
      Try Again
    </button>

    <p class="status-label">
      <span class="status-dot"></span>
      Offline
    </p>

    <script>
      // Auto-reload when connection is restored
      window.addEventListener('online', () => window.location.reload());
    </script>
  </body>
</html>
