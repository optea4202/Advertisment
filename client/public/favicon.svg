<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="ZoBazar">

  <!-- Dark green rounded square background — rx=7 gives iOS-app-icon feel -->
  <rect width="32" height="32" rx="7" fill="#00685f"/>

  <!-- White shopping cart
       Optimised for 32px native (scales cleanly to 16 / 64 / 128 / 192)
       Handle starts top-left, sweeps right, bag drops down, rim closes -->
  <polyline
    points="5,8 8.5,8 13,22 23,22 26,12 10,12"
    stroke="white"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Left wheel -->
  <circle cx="14" cy="25.5" r="1.8" fill="white"/>
  <!-- Right wheel -->
  <circle cx="21.5" cy="25.5" r="1.8" fill="white"/>

</svg>